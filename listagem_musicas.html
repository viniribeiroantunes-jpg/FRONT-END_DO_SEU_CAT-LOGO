<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Musical — Sistema Musical</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎵</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- ========== CABEÇALHO DA PÁGINA ==========
             O CSS posiciona o título à esquerda e os botões à direita. -->
        <div class="page-header-bar">
            <h2>🎼 Biblioteca Musical</h2>
            <div class="header-actions">
                <a href="index.html" class="btn-back">
                    ⬅ Voltar ao Menu
                </a>
                <a href="cadastro_musica.html" class="btn-primary">
                    ➕ Nova Música
                </a>
            </div>
        </div>
        <!-- ========== FILTROS ==========
             Nesta fase, os filtros ainda não funcionam de verdade.
             Na Sprint 2, o PHP será responsável por filtrar os dados. -->
        <div class="filters">
            <form method="get" class="filter-form" action="#">
                <!-- Grupo dos três filtros. -->
                <div class="filter-group">
                    <!-- Filtro de busca geral. -->
                    <div class="filter-item">
                        <label for="busca">Busca geral</label>
                        <input
                            type="text"
                            name="busca"
                            id="busca"
                            placeholder="Título, álbum ou artista..."
                        >
                    </div>
                    <!-- Filtro de artista. -->
                    <div class="filter-item">
                        <label for="artista">Artista</label>
                        <select name="artista" id="artista">
                            <option value="">Todos os artistas</option>
                            <option value="1">Djavan</option>
                            <option value="2">Marisa Monte</option>
                        </select>
                    </div>
                    <!-- Filtro de gênero musical. -->
                    <div class="filter-item">
                        <label for="genero">Gênero</label>
                        <select name="genero" id="genero">
                            <option value="">Todos os gêneros</option>
                            <option value="MPB">MPB</option>
                        </select>
                    </div>
                </div>
                <!-- Botão para aplicar os filtros. -->
                <div class="filter-actions">
                    <button type="submit" class="btn-primary">
                        🔍 Filtrar
                    </button>
                </div>
            </form>
        </div>
        <!-- ========== TABELA DE MÚSICAS ========== -->
        <!-- table-container: caixa que envolve a tabela. -->
        <div class="table-container">
            <table>
                <!-- Cabeçalho da tabela. -->
                <thead>
                    <tr>
                        <th class="col-capa">Capa</th>
                        <th>Título</th>
                        <th>Artista</th>
                        <th>Álbum</th>
                        <th>Gênero</th>
                        <th class="col-youtube">YouTube</th>
                        <th class="col-acoes">Ações</th>
                    </tr>
                </thead> 
                <!-- Corpo da tabela com os dados de exemplo. -->
                <tbody>
                    <!-- Primeira música: Oceano. -->
                    <tr>
                        <td>
                            <div class="no-image">
                                Sem<br>capa
                            </div>
                        </td>
                        <td>Oceano</td>
                        <td>Djavan</td>
                        <td>Luz</td>
                        <td>MPB</td>
                        <td>
                            <a href="#" target="_blank" class="btn-youtube">
                                ▶ Assistir
                            </a>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <a href="#" class="btn-edit">
                                    ✏️ Editar
                                </a>
                                <a href="#" class="btn-delete">
                                    🗑️ Excluir
                                </a>
                            </div>
                        </td>
                    </tr>
                    <!-- Segunda música: Infinito Particular. -->
                    <tr>
                        <td>
                            <div class="no-image">
                                Sem<br>capa
                            </div>
                        </td>
                        <td>Infinito Particular</td>
                        <td>Marisa Monte</td>
                        <td>—</td>
                        <td>MPB</td>
                        <td>
                            <a href="#" target="_blank" class="btn-youtube">
                                ▶ Assistir
                            </a>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <a href="#" class="btn-edit">
                                    ✏️ Editar
                                </a>
                                <a href="#" class="btn-delete">
                                    🗑️ Excluir
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
